# Local test stack:  docker compose up -d --build
# Then:  docker compose exec api node scripts/seed.js --demo     (prints logins + a test API key once)
# MongoDB is also published on 127.0.0.1:27017 so the integration tests can use it:
#   TEST_MONGODB_URI=mongodb://127.0.0.1:27017/farmaslog_test npm test
services:
  mongo:
    image: mongo:7
    ports: ["127.0.0.1:27017:27017"]
    volumes: ["mongo-data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1})"]
      interval: 5s
      retries: 10
  api:
    build: .
    depends_on:
      mongo: { condition: service_healthy }
    ports: ["3000:3000"]
    environment:
      NODE_ENV: development          # allows synthetic test records and dev secrets: local use only
      MONGODB_URI: mongodb://mongo:27017/farmaslog
      SEED_ADMIN_EMAIL: admin@farmaslog.local
      SEED_ADMIN_PASSWORD: local-test-admin-password
    volumes: ["uploads:/app/uploads"]
volumes:
  mongo-data:
  uploads:
