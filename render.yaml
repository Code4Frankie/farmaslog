# Render Blueprint for the API (the web front end goes on Vercel). Render > New > Blueprint > pick this repo.
# FREE plan = good for a demo: sleeps after 15 minutes idle (about 1 minute to wake) and has NO persistent disk,
# so evidence-file uploads vanish on every restart. For real use switch to `plan: starter` and add a disk (see bottom).
services:
  - type: web
    name: farmaslog-api
    runtime: node
    plan: free
    rootDir: api
    buildCommand: npm ci --omit=dev
    startCommand: node src/server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: ALLOW_SYNTHETIC       # demo/staging only: lets test records be created. Remove for the real service.
        value: "true"
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: JWT_SECRET
        generateValue: true
      - key: LOOKUP_HMAC_SECRET
        generateValue: true
      - key: MONGODB_URI             # you will be asked for this: your MongoDB Atlas connection string
        sync: false
      - key: CORS_ORIGINS            # you will be asked: your Vercel URL (use https://example.com now, fix after Vercel deploy)
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL   # you will be asked: creates the first admin on first start
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD # you will be asked: at least 12 characters
        sync: false
    # Paid plan only (replace `plan: free` with `plan: starter`, then uncomment):
    # disk:
    #   name: uploads
    #   mountPath: /var/data
    #   sizeGB: 1
    # and set UPLOAD_DIR to /var/data/uploads
